[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism"
version = "0.2.1-beta2"
description = "Prism lets AI see through IRIS — MCP server for SQL, documents, compilation, debugging, testing, and ObjectScript execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "intersystems-irispython>=5.3.2",
    "platformdirs>=4.10.1",
    "prompt-toolkit>=3.0.53",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=14.0.0",
    "typer>=0.27.0",
    "toons>=0.7.0",
    "websockets>=16.1.1",
]

[project.scripts]
prism = "prism.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[dependency-groups]
dev = [
    "pyautogui>=0.9.54",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6",
    "pymdown-extensions>=10.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4"]
ignore = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
